appId: com.hermills.desktop
productName: Hermills
copyright: Copyright © 2026 Hermills. All rights reserved.
directories:
  output: release
publish:
  provider: github
  owner: xueckes-collab
  repo: Hermills
  releaseType: release
files:
  - apps/desktop/**
  - apps/renderer/dist/**
  - apps/server/dist/**
  - packages/core/dist/**
  - packages/agent-builder/dist/**
  - packages/runtime/dist/**
  - build/icon.png
  - build/icon.ico
  - from: packages/core
    to: node_modules/@hermills/core
    filter:
      - package.json
      - dist/**
  - from: packages/agent-builder
    to: node_modules/@hermills/agent-builder
    filter:
      - package.json
      - dist/**
  - from: packages/runtime
    to: node_modules/@hermills/runtime
    filter:
      - package.json
      - dist/**
  - package.json
extraResources:
  - from: build
    to: build
    filter:
      - icon.png
      - icon.ico
      - hermills-cloud.example.json
  - from: build
    to: .
    filter:
      - hermills-cloud.json
      - hermills-engines/**/*
  - from: packages/runtime/dist/helpers
    to: bin
    filter:
      - "**/*"
asar: true
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  notarize: true
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.inherit.plist
  gatekeeperAssess: false
  extendInfo:
    NSAppTransportSecurity:
      NSAllowsArbitraryLoads: false
      NSAllowsLocalNetworking: true
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Hermills-${version}-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Hermills
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
dmg:
  sign: true
  title: Hermills Installer
  background: build/dmg-background.tiff
  icon: build/icon.icns
  iconSize: 96
  window:
    width: 540
    height: 380
  contents:
    - x: 160
      y: 245
      type: file
    - x: 380
      y: 245
      type: link
      path: /Applications
