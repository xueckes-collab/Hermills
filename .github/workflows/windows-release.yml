name: Windows Release

on:
  push:
    tags:
      - "hermills-v*-preview"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish"
        required: true
        default: "hermills-v0.1.1-preview"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and publish Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:win

      - name: Verify Windows installer
        run: npm run verify:win

      - name: Write Windows checksums
        run: npm run checksum:win

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermills-windows-installer
          path: |
            release/Hermills-*-x64-setup.exe
            release/Hermills-*-x64-setup.exe.blockmap
            release/latest.yml
            release/SHA256SUMS-win.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Hermills ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            release/Hermills-*-x64-setup.exe
            release/Hermills-*-x64-setup.exe.blockmap
            release/latest.yml
            release/SHA256SUMS-win.txt
